<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootPulse | Actu Sport & Pronos</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --surface: #232323;
            --border: rgba(255,255,255,0.08);
            --text: #e8e8e8;
            --muted: #888;
            --accent: #ff6b35;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text);
            line-height: 1.6;
        }

        /* ── HEADER ── */
        header {
            position: relative;
            background: linear-gradient(160deg, #1a0000 0%, #0f0f0f 60%),
                        url('https://images.unsplash.com/photo-1504450758481-7338eba7524a?auto=format&fit=crop&w=1350&q=80') center/cover no-repeat;
            background-blend-mode: multiply;
            padding: 70px 20px 100px;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%);
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 60%, rgba(211,47,47,.25) 0%, transparent 60%);
        }
        header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(3em, 8vw, 5.5em);
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            position: relative;
            text-shadow: 0 0 60px rgba(211,47,47,.5);
            transition: text-shadow .3s;
        }
        header h1:hover { text-shadow: 0 0 80px rgba(211,47,47,.9); }
        header p { opacity: .65; font-size: .95em; margin-top: 8px; position: relative; letter-spacing: 2px; text-transform: uppercase; }

        /* ── PROMO BANNER ── */
        .promo-banner {
            max-width: 1100px;
            margin: -40px auto 40px;
            background: linear-gradient(90deg, #0d47a1, #1565c0);
            color: white;
            padding: 16px 25px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0,0,0,.5);
            position: relative;
            z-index: 10;
            gap: 15px;
        }
        .promo-banner span { font-size: .9em; }
        .promo-code {
            font-family: 'Oswald', sans-serif;
            font-size: 1.6em;
            background: rgba(255,255,255,.2);
            padding: 4px 16px;
            border-radius: 8px;
            letter-spacing: 2px;
        }

        /* ── LAYOUT ── */
        #content { max-width: 1100px; margin: 0 auto 80px; padding: 0 20px; }

        /* ── GRID ── */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 28px; }

        .article-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.4);
            cursor: pointer;
            transition: transform .3s, box-shadow .3s;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border);
        }
        .article-card:hover { transform: translateY(-8px); box-shadow: 0 20px 50px rgba(211,47,47,.2); }

        .img-container {
            height: 200px;
            overflow: hidden;
            position: relative;
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
        .article-card:hover .img-container img { transform: scale(1.05); }

        .card-meta {
            display: flex;
            gap: 14px;
            padding: 12px 20px 0;
            font-size: .78em;
            color: var(--muted);
        }
        .card-meta span { display: flex; align-items: center; gap: 4px; }

        .article-content { padding: 14px 20px 20px; }
        .article-content h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.35em;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .article-content p { font-size: .85em; color: var(--muted); }

        /* ── FULL ARTICLE ── */
        .article-hero {
            position: relative;
            height: 420px;
            overflow: hidden;
            border-radius: 20px;
            margin-bottom: 0;
        }
        .article-hero img { width: 100%; height: 100%; object-fit: cover; }
        .article-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,.85) 40%, transparent 80%);
            display: flex;
            align-items: flex-end;
            padding: 35px;
        }
        .article-hero-overlay h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1.8em, 4vw, 3em);
            line-height: 1.2;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0,0,0,.5);
        }

        .full-article {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-top: 20px;
            overflow: hidden;
        }
        .full-article-inner { padding: 35px; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
            color: var(--primary);
            font-weight: 600;
            font-size: .9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: gap .2s;
        }
        .back-btn:hover { gap: 10px; }

        /* ── STATS BAR ── */
        .stats-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .stat-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: .85em;
            color: var(--muted);
        }
        .stat-pill strong { color: var(--text); font-size: 1em; }

        /* ── SHARE BAR ── */
        .share-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 9px 16px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-weight: 600;
            font-size: .85em;
            transition: all .2s;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }
        .btn-like {
            background: var(--surface);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-like:hover, .btn-like.active { background: #3d0000; color: #ff6b6b; border-color: #ff6b6b; transform: scale(1.05); }
        .btn-fb  { background: #1877f2; color: #fff; }
        .btn-wa  { background: #25d366; color: #fff; }
        .btn-tw  { background: #1a1a1a; color: #fff; border: 1px solid #333; }
        .btn-action:hover { filter: brightness(1.15); transform: translateY(-1px); }

        /* ── ARTICLE BODY ── */
        .full-article-body {
            line-height: 1.85;
            font-size: 1.05em;
            color: #ccc;
        }
        .full-article-body h1,
        .full-article-body h2,
        .full-article-body h3 { font-family: 'Oswald', sans-serif; color: #fff; margin: 28px 0 12px; }
        .full-article-body p  { margin-bottom: 16px; }
        .full-article-body img { width: 100%; border-radius: 12px; margin: 20px 0; }
        .full-article-body a  { color: var(--primary); }
        .full-article-body blockquote {
            border-left: 3px solid var(--primary);
            padding: 12px 20px;
            margin: 20px 0;
            background: var(--surface);
            border-radius: 0 10px 10px 0;
            color: #aaa;
            font-style: italic;
        }

        /* ── COMMENTS ── */
        .comments-section { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 30px; }
        .comments-section h3 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.4em;
            margin-bottom: 20px;
            color: #fff;
        }

        .comment-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .comment-form input,
        .comment-form textarea {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: .9em;
            outline: none;
            transition: border-color .2s;
            resize: vertical;
        }
        .comment-form input:focus,
        .comment-form textarea:focus { border-color: var(--primary); }
        .comment-form input::placeholder,
        .comment-form textarea::placeholder { color: var(--muted); }
        .btn-submit {
            align-self: flex-start;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 11px 26px;
            border-radius: 50px;
            font-weight: 600;
            font-size: .9em;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background .2s, transform .2s;
        }
        .btn-submit:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

        .comment-list { display: flex; flex-direction: column; gap: 16px; }
        .comment-item {
            background: var(--surface);
            border-radius: 14px;
            padding: 16px 20px;
            border: 1px solid var(--border);
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .comment-author { font-weight: 600; color: #fff; font-size: .9em; }
        .comment-date { font-size: .75em; color: var(--muted); }
        .comment-body { font-size: .88em; color: #bbb; line-height: 1.6; }
        .no-comments { color: var(--muted); font-style: italic; font-size: .9em; text-align: center; padding: 20px; }

        /* ── LOADING ── */
        .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-style: italic; }
        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, #2a2a2a 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 10px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e1e1e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: .85em;
            font-weight: 600;
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0,0,0,.5);
            transition: transform .3s ease;
            z-index: 9999;
            pointer-events: none;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* ── FOOTER ── */
        footer {
            background: #080808;
            color: white;
            padding: 60px 20px 30px;
            text-align: center;
            clip-path: polygon(0 8%, 100% 0, 100% 100%, 0 100%);
            border-top: 1px solid var(--border);
        }
        .footer-content { max-width: 1100px; margin: 0 auto; }
        .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; margin: 25px 0; }
        .footer-link {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            font-size: .9em;
            opacity: .8;
            transition: opacity .2s;
        }
        .footer-link:hover { opacity: 1; }
        .icon-circle {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: .85em;
        }

        @media (max-width: 600px) {
            .promo-banner { flex-direction: column; text-align: center; margin: -20px 15px 30px; }
            .article-hero { height: 280px; }
            .full-article-inner { padding: 20px; }
            .article-hero-overlay { padding: 20px; }
        }
    </style>
</head>

    <script>
    // ============================================================
    // ⚙️  CONFIGURATION — À MODIFIER
    // ============================================================
    const GITHUB_REPO   = "sergiosveve-ctrl/blog-sport-togo";
    const GITHUB_FOLDER = "blog";

    // 👇 Remplace ces deux valeurs par celles de ton projet Supabase
    // Supabase > Settings > API > Project URL  &  anon public key
    const SUPABASE_URL      = "https://bmcjabqxjbkppewwnnpn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtY2phYnF4amJrcHBld3dubnBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDA5NjYsImV4cCI6MjA5NDA3Njk2Nn0.D2GCN78ARPi0DQS1qbGmcPoZE1AWevuZQDjNhMjD1Kk";
    // ============================================================

    const mainView = document.getElementById('main-view');

    // ── Supabase helpers (sans SDK, pur fetch) ──────────────────
    function sbHeaders() {
        return {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Prefer": "return=representation"
        };
    }

    async function sbGet(table, filter = "") {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, { headers: sbHeaders() });
        return r.ok ? r.json() : [];
    }

    async function sbUpsert(table, data) {
        return fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
            method: "POST",
            headers: { ...sbHeaders(), "Prefer": "resolution=merge-duplicates,return=representation" },
            body: JSON.stringify(data)
        });
    }

    async function sbRpc(fn, params) {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
            method: "POST",
            headers: sbHeaders(),
            body: JSON.stringify(params)
        });
        return r.json();
    }

    async function incrementField(articleId, field) {
        // S'assure que la ligne existe puis incrémente
        await sbUpsert("article_stats", { id: articleId, views: 0, likes: 0, shares: 0 });
        await fetch(`${SUPABASE_URL}/rest/v1/article_stats?id=eq.${encodeURIComponent(articleId)}`, {
            method: "PATCH",
            headers: { ...sbHeaders(), "Prefer": "return=minimal" },
            body: JSON.stringify({ [field]: `${field}+1` })
        });
        // On utilise un RPC SQL pour l'incrément sûr
        await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_stat`, {
            method: "POST",
            headers: sbHeaders(),
            body: JSON.stringify({ p_id: articleId, p_field: field })
        });
    }

    async function getStats(articleId) {
        const rows = await sbGet("article_stats", `id=eq.${encodeURIComponent(articleId)}`);
        return rows[0] || { views: 0, likes: 0, shares: 0 };
    }

    async function getComments(articleId) {
        return sbGet("comments", `article_id=eq.${encodeURIComponent(articleId)}&order=created_at.desc`);
    }

    async function postComment(articleId, author, content) {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/comments`, {
            method: "POST",
            headers: sbHeaders(),
            body: JSON.stringify({ article_id: articleId, author, content })
        });
        return r.ok;
    }

    // ── Toast ───────────────────────────────────────────────────
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Navigation ──────────────────────────────────────────────
    function goHome() {
        history.pushState({}, '', window.location.pathname);
        loadList();
    }

    // ── Helpers parsing ──────────────────────────────────────────
    function extractMeta(content) {
        const parts = content.split('---');
        const meta  = parts.length > 1 ? parts[1] : "";
        const body  = parts.length > 2 ? parts.slice(2).join('---') : parts[0];
        const title = (meta.match(/title:\s*"(.*?)"/) || meta.match(/title:\s*(.+)/) || ["","Sans titre"])[1].trim();
        const image = (meta.match(/image:\s*"(.*?)"/) || meta.match(/image:\s*(.+)/) || ["","https://images.unsplash.com/photo-1461891263873-d81a64bb1030?auto=format&fit=crop&w=800&q=80"])[1].trim();
        const date  = (meta.match(/date:\s*(.+)/)  || ["",""])[1].trim();
        return { title, image, body, date };
    }

    function formatDate(iso) {
        if (!iso) return "";
        try { return new Date(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' }); }
        catch { return iso; }
    }

    // ── Liste des articles ───────────────────────────────────────
    async function loadList() {
        mainView.innerHTML = '<p class="loading">Chargement des articles...</p>';
        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FOLDER}`);
            const files = await response.json();
            const mdFiles = Array.isArray(files)
                ? files.filter(f => f.name.endsWith('.md') && f.name !== '.gitkeep').reverse()
                : [];

            if (!mdFiles.length) {
                mainView.innerHTML = '<p class="loading">Aucun article pour le moment.</p>';
                return;
            }

            // Chargement parallèle
            const articles = await Promise.all(mdFiles.map(async file => {
                const res  = await fetch(file.download_url);
                const text = await res.text();
                const meta = extractMeta(text);
                const stats = await getStats(file.name).catch(() => ({ views:0, likes:0, shares:0 }));
                return { file, meta, stats };
            }));

            let html = '<div class="grid">';
            for (const { file, meta, stats } of articles) {
                html += `
                <a href="?p=${file.name}" class="article-card" onclick="event.preventDefault();loadSingle('${file.name}')">
                    <div class="img-container"><img src="${meta.image}" alt="${meta.title}" loading="lazy"></div>
                    <div class="card-meta">
                        <span>👁 ${stats.views || 0}</span>
                        <span>❤️ ${stats.likes || 0}</span>
                        <span>💬</span>
                        ${meta.date ? `<span>📅 ${formatDate(meta.date)}</span>` : ''}
                    </div>
                    <div class="article-content">
                        <h2>${meta.title}</h2>
                        <p>Cliquez pour lire la suite →</p>
                    </div>
                </a>`;
            }
            html += '</div>';
            mainView.innerHTML = html;
        } catch (e) {
            console.error(e);
            mainView.innerHTML = '<p class="loading">Erreur de chargement des articles.</p>';
        }
    }

    // ── Article complet ──────────────────────────────────────────
    async function loadSingle(fileName) {
        history.pushState({ p: fileName }, '', `?p=${fileName}`);
        mainView.innerHTML = '<p class="loading">Chargement de l\'article...</p>';

        try {
            const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO}/main/${GITHUB_FOLDER}/${fileName}`);
            const content  = await response.text();
            const { title, image, body, date } = extractMeta(content);

            // Incrémenter les vues
            await sbUpsert("article_stats", { id: fileName, views: 0, likes: 0, shares: 0 }).catch(()=>{});
            // ✅ CORRECTION : await ajouté pour attendre l'incrément avant de lire les stats
            await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_stat`, {
                method: "POST", headers: sbHeaders(),
                body: JSON.stringify({ p_id: fileName, p_field: "views" })
            }).catch(()=>{});

            const stats    = await getStats(fileName).catch(() => ({ views:0, likes:0, shares:0 }));
            const comments = await getComments(fileName).catch(() => []);

            const liked = localStorage.getItem(`liked_${fileName}`) === '1';
            const currentUrl  = encodeURIComponent(window.location.href);
            const shareText   = encodeURIComponent("À lire sur FootPulse : " + title);

            const commentsHtml = comments.length
                ? comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-header">
                            <span class="comment-author">👤 ${c.author}</span>
                            <span class="comment-date">${formatDate(c.created_at)}</span>
                        </div>
                        <div class="comment-body">${c.content}</div>
                    </div>`).join('')
                : '<p class="no-comments">Soyez le premier à commenter !</p>';

            mainView.innerHTML = `
                ${image ? `<div class="article-hero">
                    <img src="${image}" alt="${title}">
                    <div class="article-hero-overlay"><h1>${title}</h1></div>
                </div>` : ''}

                <div class="full-article">
                    <div class="full-article-inner">
                        <div class="back-btn" onclick="goHome()">← Retour</div>

                        <div class="stats-bar">
                            <div class="stat-pill">👁 <strong id="view-count">${(stats.views||0)+1}</strong> vues</div>
                            <div class="stat-pill">❤️ <strong id="like-count">${(stats.likes||0) + (liked ? 1 : 0)}</strong> likes</div>
                            <div class="stat-pill">🔗 <strong id="share-count">${stats.shares||0}</strong> partages</div>
                            ${date ? `<div class="stat-pill">📅 ${formatDate(date)}</div>` : ''}
                        </div>

                        <div class="share-bar">
                            <button id="btn-like" class="btn-action btn-like ${liked ? 'active' : ''}"
                                onclick="handleLike('${fileName}')">
                                ❤️ J'aime
                            </button>
                            <a onclick="handleShare('${fileName}')"
                               href="https://www.facebook.com/sharer/sharer.php?u=${currentUrl}"
                               target="_blank" class="btn-action btn-fb">
                                Partager
                            </a>
                            <a onclick="handleShare('${fileName}')"
                               href="https://wa.me/?text=${shareText}%20${currentUrl}"
                               target="_blank" class="btn-action btn-wa">
                                WhatsApp
                            </a>
                            <a onclick="handleShare('${fileName}')"
                               href="https://twitter.com/intent/tweet?url=${currentUrl}&text=${shareText}"
                               target="_blank" class="btn-action btn-tw">
                                X (Twitter)
                            </a>
                        </div>

                        <div class="full-article-body">${marked.parse(body)}</div>

                        <!-- COMMENTAIRES -->
                        <div class="comments-section">
                            <h3>💬 Commentaires (<span id="comment-count">${comments.length}</span>)</h3>

                            <div class="comment-form">
                                <input id="c-name" type="text" placeholder="Votre prénom / pseudo" maxlength="50">
                                <textarea id="c-body" rows="3" placeholder="Votre commentaire..." maxlength="500"></textarea>
                                <button class="btn-submit" onclick="handleComment('${fileName}')">Publier</button>
                            </div>

                            <div id="comment-list" class="comment-list">
                                ${commentsHtml}
                            </div>
                        </div>
                    </div>
                </div>`;

            window.scrollTo({ top: 0, behavior: 'smooth' });

        } catch (e) {
            console.error(e);
            mainView.innerHTML = '<p class="loading">Article introuvable.</p>';
        }
    }

    // ── Like ─────────────────────────────────────────────────────
    async function handleLike(fileName) {
        const key = `liked_${fileName}`;
        if (localStorage.getItem(key) === '1') {
            showToast('Vous avez déjà liké cet article 😊');
            return;
        }
        localStorage.setItem(key, '1');
        document.getElementById('btn-like')?.classList.add('active');
        const likeEl = document.getElementById('like-count');
        if (likeEl) likeEl.textContent = parseInt(likeEl.textContent||0) + 1;

        await sbUpsert("article_stats", { id: fileName, views: 0, likes: 0, shares: 0 }).catch(()=>{});
        // ✅ CORRECTION : await ajouté pour attendre l'incrément
        await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_stat`, {
            method: "POST", headers: sbHeaders(),
            body: JSON.stringify({ p_id: fileName, p_field: "likes" })
        }).catch(()=>{});
        showToast('❤️ Merci pour votre like !');
    }

    // ── Share ────────────────────────────────────────────────────
    function handleShare(fileName) {
        const shareEl = document.getElementById('share-count');
        if (shareEl) shareEl.textContent = parseInt(shareEl.textContent||0) + 1;

        fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_stat`, {
            method: "POST", headers: sbHeaders(),
            body: JSON.stringify({ p_id: fileName, p_field: "shares" })
        }).catch(()=>{});
    }

    // ── Commentaire ──────────────────────────────────────────────
    async function handleComment(fileName) {
        const nameEl = document.getElementById('c-name');
        const bodyEl = document.getElementById('c-body');
        const btn    = document.querySelector('.btn-submit');

        const author  = nameEl?.value.trim();
        const content = bodyEl?.value.trim();

        if (!author || !content) { showToast('⚠️ Remplis tous les champs !'); return; }
        if (content.length < 3)  { showToast('⚠️ Commentaire trop court.'); return; }

        btn.disabled = true;
        btn.textContent = 'Publication...';

        const ok = await postComment(fileName, author, content).catch(() => false);
        if (ok) {
            showToast('✅ Commentaire publié !');
            nameEl.value = '';
            bodyEl.value = '';

            // Ajouter le commentaire en haut de la liste sans reload
            const listEl    = document.getElementById('comment-list');
            const countEl   = document.getElementById('comment-count');
            const noComment = listEl?.querySelector('.no-comments');
            if (noComment) noComment.remove();

            const div = document.createElement('div');
            div.className = 'comment-item';
            div.innerHTML = `
                <div class="comment-header">
                    <span class="comment-author">👤 ${author}</span>
                    <span class="comment-date">À l'instant</span>
                </div>
                <div class="comment-body">${content}</div>`;
            listEl?.insertBefore(div, listEl.firstChild);
            if (countEl) countEl.textContent = parseInt(countEl.textContent||0) + 1;
        } else {
            showToast('❌ Erreur. Vérifie ta connexion Supabase.');
        }
        btn.disabled = false;
        btn.textContent = 'Publier';
    }

    // ── Router ───────────────────────────────────────────────────
    window.addEventListener('popstate', () => {
        const p = new URLSearchParams(window.location.search).get('p');
        if (p) loadSingle(p); else loadList();
    });

    const initParam = new URLSearchParams(window.location.search).get('p');
    if (initParam) loadSingle(initParam); else loadList();
    </script>

</body>
</html>
